<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__LANTERN_TITLE__</title>
<style>/* Player chrome. Dark-first; mirrored light theme. Tokens only. */
:root {
  --bg: #000; --surface: #0a0a0a; --surface-2: #141414; --line: #262626; --line-2: #3a3a3a;
  --fg: #ededed; --muted: #a1a1a1; --dim: #6b6b6b; --accent: #fff;
  --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e4e4e7; --line-2: #d4d4d8;
  --fg: #171717; --muted: #525252; --dim: #a3a3a3; --accent: #000; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #fafafa; --surface: #fff; --surface-2: #f4f4f5; --line: #e4e4e7; --line-2: #d4d4d8;
  --fg: #171717; --muted: #525252; --dim: #a3a3a3; --accent: #000; color-scheme: light; }

* { box-sizing: border-box; }
/* A scrollbar appearing mid-playback narrows the page and shifts everything: reserve its gutter */
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
main > * { min-width: 0; }
main { max-width: 1120px; margin: 0 auto; padding-block: 10px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, select:focus-visible, .scrubber:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 36px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.logo { width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(from 180deg, var(--fg), var(--dim), var(--fg)); }
.scene-tabs { display: flex; flex: 1 1 0; min-width: 0; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; overflow-x: auto; scrollbar-width: none; }
.scene-tabs::-webkit-scrollbar { display: none; }
.single .scene-tabs, .single .scene-select { display: none; }
.tab { padding: 4px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; font-size: 13px; transition: color .15s, background .15s; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px var(--line-2); }
.scene-select { display: none; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1; }
@media (max-width: 720px) { .scene-tabs { display: none; } .scene-select { display: block; } }

/* player = stage + transport, one card */
.player { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.stage { background: #0a0a0a; position: relative; }
.stage-svg { aspect-ratio: 16 / 9; }
.stage-svg svg { display: block; width: 100%; height: 100%; }
.loading .stage-svg { opacity: .35; transition: opacity .2s; }
.loading .stage::after { content: ""; position: absolute; inset: 0; margin: auto; width: 20px; height: 20px; border: 2px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.caption { display: none; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; color: var(--fg); min-height: calc(4 * 1.45em + 20px); }
@media (max-width: 720px) { .caption { font-size: 14px; min-height: calc(6 * 1.45em + 20px); } }
.caption.on { display: block; }
.step .cap { flex-basis: 100%; display: block; font-family: var(--font); font-size: 12.5px; line-height: 1.4; color: var(--dim); margin-top: 3px; white-space: normal; }
.step[aria-current="step"] .cap { color: var(--muted); }
.transport { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-top: 1px solid var(--line); }
.icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 7px; color: var(--fg); transition: background .15s; }
.icon:hover { background: var(--surface-2); }
.scrubber { position: relative; flex: 1; height: 34px; cursor: pointer; margin: 0 10px; }
.scrubber::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: var(--line-2); border-radius: 1px; }
.scrub-fill { position: absolute; left: 0; top: 16px; height: 2px; background: var(--fg); border-radius: 1px; width: 0; }
.scrub-fill::after { content: ""; position: absolute; right: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.scrub-marks i { position: absolute; top: 13px; width: 1px; height: 8px; background: var(--dim); }
.time { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 6px; }
@media (max-width: 720px) {
  /* edge-to-edge canvas on phones: the card drops its side borders */
  .player { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); border-radius: 0; border-left: 0; border-right: 0; }
  .transport { padding: 6px max(10px, env(safe-area-inset-left, 0px)); }
}

/* panel = current step + list */
.panel { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .panel { grid-template-columns: minmax(0, 1fr); } }
.now { display: grid; gap: 10px; min-width: 0; }
.now-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.step-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.step-title b { font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: -0.01em; }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step-diff { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--mono); font-size: 13px; min-height: 22px; }
.kv { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; min-width: 0; max-width: 100%; }
.kv .k { color: var(--muted); }
.kv .old { color: var(--dim); text-decoration: line-through; }
.kv .arr { color: var(--dim); }
.kv .old, .kv .new { max-width: min(28ch, 70vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .new { color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); padding: 0 6px; border-radius: 5px; }
.kv.quiet { color: var(--dim); font-family: var(--font); font-size: 13px; }
.note { width: 100%; color: var(--muted); font-family: var(--font); font-size: 13px; }
.actions { display: flex; gap: 6px; }
.toggle { font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: var(--surface); transition: all .15s; white-space: nowrap; }
.toggle:hover { color: var(--fg); border-color: var(--line-2); }
.toggle[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }

/* step list: one row per step */
.steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
@media (min-width: 861px) { .steps { max-height: 420px; overflow-y: auto; } }
.steps li + li { border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; width: 100%; text-align: left; padding: 9px 12px; color: var(--muted); transition: background .15s, color .15s; }
.step:hover { background: var(--surface-2); color: var(--fg); }
.step[aria-current="step"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.step .idx { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.step .name { font-family: var(--mono); font-size: 13px; display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden;; flex-wrap: wrap; }
.step .name > :first-child { white-space: nowrap; }
.step .at { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.step .meta { display: flex; gap: 4px; overflow: hidden; }
.step .meta:empty { display: none; }
.chip { font-family: var(--mono); font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* guide: the homepage's how-to, below the player (app/index.html, app/guide.js) */
.guide-btn { flex: none; }
.guide { max-width: 1120px; margin: 0 auto; padding-block: 8px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; scroll-margin-top: 12px; }
.guide-head { display: grid; gap: 6px; padding-top: 22px; border-top: 1px solid var(--line); }
.guide-head > * { max-width: 72ch; }
.guide h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.guide h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.guide p { margin: 0; color: var(--muted); }
.guide code, .guide kbd { font-family: var(--mono); font-size: 12.5px; color: var(--fg); }
.guide p code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.guide a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.guide a:hover { text-decoration-color: var(--fg); }
.guide a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.agent-hint { font-size: 13px; }
.guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 860px) { .guide-grid { grid-template-columns: minmax(0, 1fr); } }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
.card[hidden] { display: none; }
.card.wide { grid-column: 1 / -1; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; align-items: start; }
.col { display: grid; gap: 10px; min-width: 0; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.card pre { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
.card pre code { font-size: inherit; }
kbd { display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); font-size: 12px; }
.keys { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 14px; margin: 0; align-items: center; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ex-list li { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 6px 6px 10px; }
.ex-list li + li { border-top: 1px solid var(--line); }
.ex-what { font-size: 12px; color: var(--dim); }
.ex { min-width: 0; text-decoration: none; }
.ex code { font-size: 12px; overflow-wrap: anywhere; }
.ex:hover code { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.copy { padding: 3px 8px; font-size: 11.5px; }
@media (max-width: 520px) { .ex-list li { grid-template-columns: minmax(0, 1fr) auto; } .ex-what { grid-column: 1 / -1; } }
.scene-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.scene-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 500; padding: 0 8px 6px 0; }
.scene-table td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: top; color: var(--muted); }
.scene-table td:last-child { white-space: nowrap; padding-right: 0; }
.scene-table td:last-child .chip + .chip { margin-left: 4px; }
.guide .chip { text-decoration: none; }
.guide .chip:hover { color: var(--fg); border-color: var(--line-2); }
@media (max-width: 520px) { .scene-table th:nth-child(2), .scene-table td:nth-child(2) { display: none; } }
</style>
