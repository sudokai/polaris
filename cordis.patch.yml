# DeepSeek Harness bundle: adds polaris's skills to the profile.
# The skills directory is resolved through the installed package, because
# relative paths resolve against the profile, not this file.
- insert:
    - id: polaris-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: polaris
        includeDefaultRoots: false
        customSkillDirs:
          - !!js |-
            process.getBuiltinModule('node:path').join(
              process.getBuiltinModule('node:path').dirname(
                process.getBuiltinModule('node:module').createRequire(ctx.baseUrl).resolve('polaris/package.json')),
              'skills')
